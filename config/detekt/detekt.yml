# Project detekt overrides. Layered on top of detekt's default config
# (buildUponDefaultConfig = true in the quality convention plugin).

build:
  maxIssues: 0

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
    excludes: ['**/test/**', '**/androidTest/**']

style:
  MagicNumber:
    active: false
  UnusedPrivateMember:
    active: false
  ForbiddenComment:
    # TODO markers are tracked in the plan / memory, not banned.
    active: false
  MaxLineLength:
    # Room migrations and their tests carry verbatim DDL copied from the exported schema JSON.
    excludes: ['**/database/migration/**']

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
    # Repo impls take a DB handle + several DAOs + writers; DAO update-queries take a column list.
    excludes:
      ['**/entity/**', '**/test/**', '**/androidTest/**', '**/core/testing/**',
       '**/*RepositoryImpl.kt', '**/*Dao.kt', '**/*Recorder.kt']
  LongMethod:
    # Migrations carry verbatim DDL; a NavHost is a flat declarative list of destinations;
    # a @Composable is a declarative UI tree, not imperative logic.
    excludes: ['**/database/migration/**', '**/navigation/*NavHost.kt']
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    # Fluent builders (DAOs, the ESC/POS byte builder), Hilt aggregator modules, MVI
    # ViewModels (one method per user intent) and multi-step form action-bags are many small
    # one-liner methods by design.
    excludes:
      ['**/*Repository.kt', '**/*RepositoryImpl.kt', '**/*Dao.kt', '**/EscPosBuilder.kt',
       '**/di/*Module.kt', '**/*ViewModel.kt', '**/setup/SetupWizard*.kt',
       '**/inventory/Inventory.kt', '**/test/**', '**/androidTest/**']
