# Project detekt overrides. Layered on top of detekt's default config
# (buildUponDefaultConfig = true in the quality convention plugin).

build:
  maxIssues: 0

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
    excludes: ['**/test/**', '**/androidTest/**']

style:
  MagicNumber:
    active: false
  UnusedPrivateMember:
    active: false
  MaxLineLength:
    # Room migrations and their tests carry verbatim DDL copied from the exported schema JSON.
    excludes: ['**/database/migration/**']

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
    excludes: ['**/entity/**', '**/test/**', '**/androidTest/**', '**/core/testing/**']
  LongMethod:
    excludes: ['**/database/migration/**']
